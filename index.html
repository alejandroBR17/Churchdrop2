<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <script>
      (() => {
        if (!location.hash.startsWith('#access=')) return;
        let token = location.hash.slice(8);
        if (!/^[a-f0-9]{64}$/.test(token)) token = '';
        history.replaceState(history.state, '', location.pathname + location.search);
        window.__univerTakeAccessLink = () => { const value = token; token = null; return value; };
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <script>
      (() => {
        let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        try { const saved = localStorage.getItem('theme'); if (saved === 'light' || saved === 'dark') dark = saved === 'dark'; } catch {}
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <!-- SEO Principal -->
    <title>Univer Mídia - Transferência de Arquivos</title>
    <meta name="description" content="Sistema de gestão de mídia para igrejas. Envie vídeos, imagens e PDFs com agilidade." />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Univer Mídia">

    <!-- Favicon (Novo Logo Definitivo) -->
    <link rel="icon" type="image/png" href="https://imgur.com/XaqB3Ri.png" />
    <!-- Apple Touch Icon (Novo Logo Definitivo) -->
    <link rel="apple-touch-icon" href="https://imgur.com/XaqB3Ri.png" />

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(reg => console.log('SW registrado!', reg.scope))
            .catch(err => console.log('SW falhou:', err));
        });
      }
    </script>
  </body>
</html>
