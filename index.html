<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- SEO Principal -->
    <title>Univer Mídia - Transferência de Arquivos</title>
    <meta name="description" content="Sistema de gestão de mídia para igrejas. Envie vídeos, imagens e PDFs com agilidade." />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Univer Mídia">

    <!-- Favicon (Novo Logo Definitivo) -->
    <link rel="icon" type="image/png" href="https://imgur.com/XaqB3Ri.png" />
    <!-- Apple Touch Icon (Novo Logo Definitivo) -->
    <link rel="apple-touch-icon" href="https://imgur.com/XaqB3Ri.png" />

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@^5.4.624",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "pdfjs-dist/": "https://esm.sh/pdfjs-dist@^5.4.624/",
    "browser-image-compression": "https://esm.sh/browser-image-compression@2.0.2",
    "jszip": "https://esm.sh/jszip@3.10.1"
  }
}
</script>
</head>
  <body class="bg-neutral-950 text-neutral-100 antialiased overflow-hidden selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registrado!', reg.scope))
            .catch(err => console.log('SW falhou:', err));
        });
      }
    </script>
  </body>
